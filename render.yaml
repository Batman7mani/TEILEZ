# Render Blueprint: deploys the FastAPI backend. Postgres lives on Neon (DATABASE_URL).
services:
  - type: web
    name: teilez-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # seed_data is idempotent: it skips products that already exist
    startCommand: python -m scripts.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://batman7mani.github.io
